[project]
name = "mcp-context-retrieval"
version = "0.1.0"
description = "MCP Server 3: Context Retrieval. Hybrid semantic search across chain blocks, plain-language history with reasoned checkpoints, and snapshot-based backtracking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cursor-hackathon" }]

dependencies = [
    "mcp[cli]>=1.27.0",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real semantic embeddings. Without this we fall back to a hashed-token TF-IDF
# similarity that still works for the demo but is less accurate.
embeddings = ["sentence-transformers>=2.7"]

# Claude-powered plain-language history summaries. Without this we fall back to
# an extractive summarizer so the server still functions offline.
summaries = ["anthropic>=0.39"]

# Test suite.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# Demo web UI: thin FastAPI bridge over the same Store/Search/Summarizer
# code the MCP tools use, plus a vanilla-JS single-page frontend.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

# Everything.
all = [
    "sentence-transformers>=2.7",
    "anthropic>=0.39",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
mcp-context-retrieval = "context_retrieval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_retrieval"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
